services:
  - type: web
    name: hypercross-nexus
    runtime: node
    rootDir: hypercross-nexus-main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HYPERCROSS_PUBLIC_URL
        value: https://www.hypercrossfinancial.online
      - key: ALLOWED_ORIGINS
        value: https://www.hypercrossfinancial.online,https://hypercrossfinancial.online,https://www.hypercrossfinancial.com,https://hypercrossfinancial.com
      - key: ZEROX_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
